name: 更新政大課程 CSV

on:
  workflow_dispatch:
  schedule:
    # 每6小時執行一次；GitHub Actions排程使用UTC。
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nccu-course-csv-update
  cancel-in-progress: false

jobs:
  update-courses:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取政大全校課程並產生 CSV
        env:
          NCCU_SEMESTER: "1151"
          NCCU_PROXY_URL: "https://nccu-course-proxy.114961062.workers.dev"
          NCCU_MAX_WORKERS: "3"
          NCCU_RETRIES: "3"
          NCCU_MIN_COURSES: "500"
        run: python scripts/update_courses.py

      - name: 僅在資料變更時提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nccu_courses_1151.csv data/units.json data/metadata.json
          if git diff --cached --quiet; then
            echo "課程資料沒有變更，不建立新 commit。"
            exit 0
          fi
          git commit -m "自動更新政大115-1課程資料"
          git push

