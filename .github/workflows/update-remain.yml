name: Update NCCU Course Remain

on:
  workflow_dispatch:

  schedule:
    # 每小時第 15 分鐘檢查一次
    # 實際只有在 115-1 選課期間才會繼續執行
    - cron: "15 * * * *"

    # 非選課期間：每月 1 日台灣時間 08:30 更新一次
    # GitHub Actions cron 使用 UTC
    # UTC 00:30 = 台灣時間 08:30
    - cron: "30 0 1 * *"

permissions:
  contents: write

concurrency:
  group: nccu-course-remain
  cancel-in-progress: false

jobs:
  update-remain:
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether to update
        id: schedule_check
        shell: bash
        run: |
          export TZ=Asia/Taipei

          NOW_DATE=$(date +%Y-%m-%d)
          NOW_TIME=$(date +%H%M)

          echo "Taiwan date: $NOW_DATE"
          echo "Taiwan time: $NOW_TIME"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

          SHOULD_RUN=false
          REASON="Outside registration period"

          # ============================================
          # 手動執行
          # ============================================
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN=true
            REASON="Manual run"

          # ============================================
          # 每月定期更新
          # ============================================
          elif [ "${{ github.event.schedule }}" = "30 0 1 * *" ]; then
            SHOULD_RUN=true
            REASON="Monthly update"

          # ============================================
          # 115-1 第一階段初選
          # 2026/08/25 09:00 ～ 2026/08/26 17:00
          # ============================================
          elif \
            { [ "$NOW_DATE" = "2026-08-25" ] && [ "$NOW_TIME" -ge 0900 ]; } || \
            { [ "$NOW_DATE" = "2026-08-26" ] && [ "$NOW_TIME" -le 1700 ]; }
          then
            SHOULD_RUN=true
            REASON="115-1 first registration period"

          # ============================================
          # 115-1 第二階段初選
          # 2026/08/31 09:00 ～ 2026/09/02 17:00
          # ============================================
          elif \
            { [ "$NOW_DATE" = "2026-08-31" ] && [ "$NOW_TIME" -ge 0900 ]; } || \
            { [ "$NOW_DATE" = "2026-09-01" ]; } || \
            { [ "$NOW_DATE" = "2026-09-02" ] && [ "$NOW_TIME" -le 1700 ]; }
          then
            SHOULD_RUN=true
            REASON="115-1 second registration period"

          # ============================================
          # 115-1 第三階段加退選
          # 2026/09/07 09:00 ～ 2026/09/14 17:00
          # ============================================
          elif \
            { [ "$NOW_DATE" = "2026-09-07" ] && [ "$NOW_TIME" -ge 0900 ]; } || \
            { [ "$NOW_DATE" \> "2026-09-07" ] && [ "$NOW_DATE" \< "2026-09-14" ]; } || \
            { [ "$NOW_DATE" = "2026-09-14" ] && [ "$NOW_TIME" -le 1700 ]; }
          then
            SHOULD_RUN=true
            REASON="115-1 add/drop period"

          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "Decision: $SHOULD_RUN"
          echo "Reason: $REASON"

      - name: Skip outside update period
        if: steps.schedule_check.outputs.should_run != 'true'
        run: |
          echo "目前不是選課期間，也不是每月定期更新日。"
          echo "本次不抓取全校選課人數。"

      - name: Checkout repository
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update NCCU course remain data
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          echo "Update reason: ${{ steps.schedule_check.outputs.reason }}"
          python scripts/update_remain.py

      - name: Show generated remain CSV
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          echo "===== nccu_course_remain_1151.csv ====="
          head -20 data/nccu_course_remain_1151.csv

      - name: Show file statistics
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          echo "===== File statistics ====="
          wc -l data/nccu_course_remain_1151.csv
          ls -lh data/nccu_course_remain_1151.csv

      - name: Commit updated remain data
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nccu_course_remain_1151.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NCCU course remain data"
            git push
          fi
