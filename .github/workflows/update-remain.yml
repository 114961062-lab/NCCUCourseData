name: Update NCCU Course Remain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-remain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update course remain
        run: |
          python scripts/update_remain.py

      - name: Show output
        run: |
          echo "===== remain csv ====="
          head -20 data/nccu_course_remain_1151.csv

      - name: Commit updated remain data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nccu_course_remain_1151.csv

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update NCCU course remain data"
            git push
          fi
